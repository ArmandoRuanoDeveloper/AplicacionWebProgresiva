spring.cloud.config.enabled=false
server.port=${PORT:8080}

# Autenticación GestoPago
gestopago.auth.url=https://gestopago.portalventas.net
gestopago.auth.id-distribuidor=${GESTOPAGO_ID_DISTRIBUIDOR:83}
gestopago.auth.codigo-dispositivo=${GESTOPAGO_CODIGO_DISPOSITIVO:GPS83-TPV-17}
gestopago.auth.password=${GESTOPAGO_PASSWORD:12345678}
gestopago.auth.refresh-rate-ms=82800000

# Servicio externo: catálogo de productos
product-service.url=https://gestopago.portalventas.net
product-service.connect-timeout=5000
product-service.read-timeout=5000
product-service.api-key=${PRODUCT_SERVICE_API_KEY:YSX1HpAFum4TpCecyFBxs4eIjAlbhKqK6fpcSQp8}
product-service.sync-cron=0 0 3 * * *

# Timeouts específicos del Feign Client de productos
feign.client.config.productService.connectTimeout=${product-service.connect-timeout}
feign.client.config.productService.readTimeout=${product-service.read-timeout}

# MongoDB
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/aplicacion_web_progresiva}
spring.data.mongodb.database=aplicacion_web_progresiva

# PostgreSQL
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/aplicacion_web_progresiva}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:linux}

# JWT Configuration
jwt.secret=${JWT_SECRET:vN7#qL2!xR9@kT4$zP8&mW6^cY3*Fh1sgui190}
jwt.expiration-ms=3600000